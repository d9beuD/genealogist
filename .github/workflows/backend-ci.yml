name: Backend CI

on:
  push:
    branches:
      - d9beuD/ref/api-vue-migration-base
  pull_request:
    branches:
      - d9beuD/ref/api-vue-migration-base

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      APP_VERSION: test
      DATABASE_URL: sqlite:///%kernel.project_dir%/var/ci.db
      JWT_PASSPHRASE: ci-jwt-passphrase
      SYMFONY_DEPRECATIONS_HELPER: 999999
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          extensions: ctype, iconv, intl, pdo_sqlite, sqlite3

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4
        with:
          working-directory: backend
          dependency-versions: locked
          composer-options: --no-interaction --prefer-dist --no-progress

      - name: Validate Composer configuration
        run: composer validate --strict --no-check-publish

      - name: Run static analysis
        run: composer analyse

      - name: Run Rector dry-run
        run: composer rector

      - name: Check coding standards
        run: |
          if [ -f .php-cs-fixer.php ] || [ -f .php-cs-fixer.dist.php ]; then
            composer cs:check
          else
            echo "Skipping PHP-CS-Fixer because no config file is committed yet."
          fi

      - name: Generate JWT keys
        run: php bin/console lexik:jwt:generate-keypair --skip-if-exists --env=test

      - name: Prepare test database
        run: |
          mkdir -p var
          rm -f var/ci.db
          php bin/console doctrine:schema:create --env=test

      - name: Run unit tests
        run: |
          php bin/phpunit tests/Api tests/Entity tests/Service
