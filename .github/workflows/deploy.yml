name: Deploy to Coolify

on: 
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: deploy-coolify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trigger-coolify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deployment
        env:
          COOLIFY_DEPLOY_WEBHOOK_URL: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$COOLIFY_DEPLOY_WEBHOOK_URL" ]; then
            echo "COOLIFY_DEPLOY_WEBHOOK_URL secret is missing" >&2
            exit 1
          fi

          curl --fail --silent --show-error --request POST "$COOLIFY_DEPLOY_WEBHOOK_URL"
