name: genealogist

services:
  ###> doctrine/doctrine-bundle ###
  database:
    image: mariadb:10.6.20
    environment:
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:-root_password}
      - MARIADB_USER=${MARIADB_USER:-app}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD:-app_password}
      - MARIADB_DATABASE=${MARIADB_DATABASE:-app}
    volumes:
      - database_data:/bitnami/mariadb
    networks:
      - genealogist_network
    ports:
      - 3306:3306
    restart: unless-stopped
  ###< doctrine/doctrine-bundle ###

  phpmyadmin:
    image: phpmyadmin:5.2.1
    ports:
      - 8080:80
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=database
      - PMA_USER=${MARIADB_USER:-app}
      - PMA_PASSWORD=${MARIADB_PASSWORD:-app_password}
    depends_on:
      - database
    networks:
      - genealogist_network
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: ${APP_BUILD_TARGET:-dev}
    ports:
      - 8000:3000
    volumes:
      - .:/app/
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - database
    networks:
      - genealogist_network

networks:
  genealogist_network:
    driver: bridge

volumes:
  database_data:
  caddy_data:
  caddy_config:
