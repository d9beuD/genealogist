lexik_jwt_authentication:
    secret_key: '%env(resolve:JWT_SECRET_KEY)%'
    public_key: '%env(resolve:JWT_PUBLIC_KEY)%'
    pass_phrase: '%env(JWT_PASSPHRASE)%'
    token_extractors:
        authorization_header:
            enabled: false
        cookie:
            enabled: true
            name: BEARER
    set_cookies:
        BEARER:
            secure: true
            httpOnly: true
            samesite: strict
            path: /
    api_platform:
        check_path: /api/auth
        username_path: email
        password_path: password
